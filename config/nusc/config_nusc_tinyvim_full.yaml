# General config
num_workers: 4
id: "exp_nusc_tinyvim_full"
save_path: "save_nusc_rangevim_tinyvim_full"

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevim"
  run_name: "[train] nusc_tinyvim_base_full" # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
data:
  dataset: "nuScenes"
  n_classes: 17 # 16 + 1(ignored)
  data_root: "../dataset/nuscenes"
  has_label: true

# Train config
training:
  val_frequency: 1
  n_epochs: 120
  warmup_epochs: 10
  batch_size: 6
  batch_size_val: 1
  lr: 0.0003
  min_lr: 0.00004
  train_result_frequency: 100 # printing frequency of the train results
  loss:
    focal_loss:
      type: "focal" # "focal" (legacy alpha scaling) or "class_weighted_focal" (L = -w_c(1-p_t)^gamma log(p_t))
      gamma: 2.0
      ignore_index: 0
      weight: 1.0
    lovasz_loss:
      weight: 1.0
    boundary_loss:
      weight: 0.0 # Weight for boundary mIoU loss (only applied when use_kpconv is False)
    aux_loss:
      weight: 0.0
  # Optional manual class weights (length must equal n_classes). Leave null to use dataset-derived weights.
  class_weights: null
  save_epochs_at: []

# Model config
model:
  vit_backbone: "tinyvim_base"
  in_channels: 5
  image_size: [32, 2048]         # match nuScenes projection; no train-time crop
  window_size: [32, 2048]        # full-frame inference window
  window_stride: [32, 2048]      # single window when sliding is enabled
  original_image_size: [32, 2048]
  # Full-image switches
  train_full_image: true         # train on the full projection
  use_sliding_window: false      # full-frame inference/validation

# Decoder
decoder: "fpn" # 'linear', 'up_conv', or 'fpn'

# 3D refiner / post-processing
point_postproc: "knn" # 'kpconv', 'knn', or 'none'; overrides the boolean flags below
knn_search: 7
knn_k: 5
knn_sigma: 1.0
knn_cutoff: 1.0

# Checkpoint model
checkpoint: null

# Range image-level augmentation (applied on GPU batch before forward pass)
range_aug: true
use_fp16: true

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: "HDL64"
  type: "spherical"
  proj_h: 32
  proj_w: 2048
  fov_up: 10.
  fov_down: -30.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
